services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: youtube_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
      POSTGRES_DB: youtube_automation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube_user -d youtube_automation"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://youtube_user:${POSTGRES_PASSWORD:-local-dev-change-me}@postgres:5432/youtube_automation
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
volumes:
  postgres_data:
  frontend_node_modules:
